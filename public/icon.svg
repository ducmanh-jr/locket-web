<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0C27"/>
      <stop offset="100%" stop-color="#10091D"/>
    </linearGradient>

    <!-- Outer Pink Ring Gradient -->
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A85"/>
      <stop offset="50%" stop-color="#FF69B4"/>
      <stop offset="100%" stop-color="#FF2A85"/>
    </linearGradient>

    <!-- Inner Lens Gradient -->
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D123D"/>
      <stop offset="100%" stop-color="#10091D"/>
    </linearGradient>
  </defs>

  <!-- Squircle Outer Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Neon Pink Border Ring -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="none" stroke="url(#pinkGrad)" stroke-width="18"/>

  <!-- Camera Outer Circle Ring -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="url(#pinkGrad)" stroke-width="22"/>

  <!-- Camera Lens Inner Dark Fill -->
  <circle cx="256" cy="256" r="126" fill="url(#lensGrad)"/>

  <!-- Camera Aperture Lens Pupil (Pink Glow) -->
  <circle cx="256" cy="256" r="82" fill="#FF2A85"/>

  <!-- Specular Lens Light Highlight Dots -->
  <circle cx="216" cy="216" r="26" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="290" cy="290" r="12" fill="#FFFFFF" opacity="0.4"/>
</svg>
